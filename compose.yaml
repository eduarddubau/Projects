services:
  api:
    #user: "${UID:-1000}:${GID:-1000}"
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: build
    container_name: dotnet-api
    volumes:
      - .:/workspaces/fullstack-app:z
      - ./backend:/workspaces/fullstack-app/backend:z
      # Read-only view of the frontend deps so the dev container's TS/Angular
      # language service can resolve them; nothing here is ever executed.
      - angular_node_modules:/workspaces/fullstack-app/frontend-angular/node_modules:ro
      - ~/dotnet_docker_cache/home:/tmp/dotnet_home:z
      - ~/dotnet_docker_cache/nuget:/tmp/nuget_cache:z
    tmpfs:
      - /tmp/build:mode=777,exec
    working_dir: /workspaces/fullstack-app/backend
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
      - Jwt__Key=${Jwt__Key}
      - Jwt__Issuer=${Jwt__Issuer}
      - Jwt__Audience=${Jwt__Audience}
      - Jwt__DurationInMinutes=${Jwt__DurationInMinutes}
      - DOTNET_ENVIRONMENT=Development
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_CLI_HOME=/tmp/dotnet_home
      - NUGET_PACKAGES=/tmp/nuget_cache
      - DOTNET_USE_POLLING_FILE_WATCHER=1
      - COMPlus_EnableDiagnostics=1
    command: dotnet watch run --no-hot-reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined

  db:
    image: postgres:18-alpine
    container_name: postgres-db
    environment:
      - POSTGRES_DB=app_db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ stores data in a major-version subdirectory; mount the parent
      # so pg_upgrade --link can cross versions without a mount-point boundary.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    image: node:24-alpine
    container_name: angular-frontend
    working_dir: /app
    volumes:
      - ./frontend-angular:/app:z
      - angular_node_modules:/app/node_modules
    ports:
      - "4200:4200"
      - "4000:4000"
    command: >
      sh -c "if [ ! -d 'node_modules' ] || [ ! -f 'node_modules/.bin/ng' ]; then npm install; fi &&
             npx ng serve --host 0.0.0.0"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      api:
        condition: service_healthy

  e2e:
    image: mcr.microsoft.com/playwright:v1.61.1-noble
    container_name: frontend-e2e
    working_dir: /app
    volumes:
      - ./frontend-angular:/app:z
      - e2e_node_modules:/app/node_modules
    environment:
      - E2E_BASE_URL=http://frontend:4200
    command: >
      sh -c "until bash -c 'echo > /dev/tcp/frontend/4200' 2>/dev/null; do sleep 1; done &&
             npm install &&
             npx playwright test"
    depends_on:
      - frontend
    profiles:
      - e2e

volumes:
  postgres_data:
  angular_node_modules:
  e2e_node_modules:
