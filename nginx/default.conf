# Mounted at /etc/nginx/conf.d/default.conf, which nginx includes inside its
# http block — so `map` is legal here.
#
# WebSocket upgrades need `Connection: upgrade`, but ordinary requests need
# `Connection: close` or keepalive breaks. Hard-coding either one is wrong; this
# picks per request from whether the client sent an Upgrade header.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Hostnames resolve when nginx starts, so this container must come up after the
# ones it names — see depends_on in compose.yaml. If a backing container is
# recreated and changes address, restart this one.
upstream api_upstream {
    server api:8080;
    keepalive 16;
}

upstream frontend_upstream {
    server frontend:4200;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Dev bundles are large and streamed; buffering them to disk adds latency
    # for no benefit.
    proxy_buffering off;
    client_max_body_size 10m;

    proxy_http_version 1.1;

    # The whole point of the proxy: /api and the browser app share one origin,
    # so there is no CORS and cookies are first-party.
    location /api/ {
        proxy_pass http://api_upstream;
        include /etc/nginx/conf.d/proxy_headers.inc;
        # Empty Connection is what lets the upstream keepalive pool work.
        proxy_set_header Connection "";
    }

    location /health {
        proxy_pass http://api_upstream;
        include /etc/nginx/conf.d/proxy_headers.inc;
        proxy_set_header Connection "";
    }

    # Everything else is the Angular SSR dev server, including its HMR
    # websocket. Without the Upgrade pair the browser logs "[WDS] Disconnected!"
    # and live reload stops working with no other symptom.
    location / {
        proxy_pass http://frontend_upstream;
        include /etc/nginx/conf.d/proxy_headers.inc;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Long-lived HMR socket; the 60s default would drop it every minute.
        proxy_read_timeout 3600s;
    }
}
