<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" role="img"
     aria-label="Request path: the browser reaches one origin, where nginx splits it — slash and static assets to the Angular SSR server, slash-api and slash-health to the ASP.NET Core API, which talks to PostgreSQL through EF Core. A planned mobile client enters the same origin and uses the same bearer-token API. The three services sit behind the proxy and believe forwarded headers only from its pinned address.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9198a1"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a78bfa"/>
    </marker>
  </defs>

  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif">

  <!-- Everything the proxy fronts. The boundary is the point: it is what makes the
       forwarded-header trust below meaningful. -->
  <rect x="514" y="18" width="472" height="300" rx="14" fill="none" stroke="#3d444d" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="970" y="308" text-anchor="end" font-size="12" fill="#9198a1">behind the proxy · no published ports</text>

  <!-- Browser -->
  <rect x="40" y="125" width="170" height="84" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="125" y="158" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">Browser</text>
  <text x="125" y="180" text-anchor="middle" font-size="12" fill="#9198a1">Angular 22 · signals</text>
  <text x="125" y="196" text-anchor="middle" font-size="12" fill="#9198a1">JWT in localStorage</text>

  <!-- nginx -->
  <rect x="290" y="125" width="170" height="84" rx="10" fill="#161b22" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="375" y="158" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">nginx</text>
  <text x="375" y="180" text-anchor="middle" font-size="12" fill="#a78bfa">single origin</text>
  <text x="375" y="196" text-anchor="middle" font-size="12" fill="#9198a1">so: no CORS</text>

  <!-- SSR -->
  <text x="540" y="34" font-size="12" fill="#9198a1">/ · static</text>
  <rect x="540" y="42" width="210" height="84" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="645" y="72" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">Angular SSR (Express)</text>
  <text x="645" y="94" text-anchor="middle" font-size="12" fill="#9198a1">public routes rendered</text>
  <text x="645" y="110" text-anchor="middle" font-size="12" fill="#9198a1">app routes shipped as a shell</text>

  <!-- API -->
  <text x="540" y="204" font-size="12" fill="#9198a1">/api · /health</text>
  <rect x="540" y="212" width="210" height="84" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="645" y="242" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">ASP.NET Core 10 API</text>
  <text x="645" y="264" text-anchor="middle" font-size="12" fill="#9198a1">bearer JWT + refresh rotation</text>
  <text x="645" y="280" text-anchor="middle" font-size="12" fill="#9198a1">no cookies, no session state</text>

  <!-- Postgres -->
  <rect x="830" y="212" width="140" height="84" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="900" y="250" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">PostgreSQL</text>
  <text x="900" y="272" text-anchor="middle" font-size="12" fill="#9198a1">soft delete</text>
  <text x="900" y="288" text-anchor="middle" font-size="12" fill="#9198a1">audit stamps</text>

  <!-- Mobile (planned) -->
  <rect x="40" y="360" width="170" height="76" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="125" y="390" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">Mobile client</text>
  <text x="125" y="412" text-anchor="middle" font-size="12" fill="#9198a1">planned</text>

  <line x1="210" y1="167" x2="284" y2="167" fill="none" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#aa)"/>
  <polyline points="460,150 500,150 500,84 534,84" fill="none" stroke="#9198a1" stroke-width="1.8" marker-end="url(#a)"/>
  <polyline points="460,184 500,184 500,254 534,254" fill="none" stroke="#9198a1" stroke-width="1.8" marker-end="url(#a)"/>

  <line x1="750" y1="254" x2="824" y2="254" fill="none" stroke="#9198a1" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="787" y="242" text-anchor="middle" font-size="12" fill="#9198a1">EF Core</text>

  <!-- Mobile -> nginx: the same origin, the same token API -->
  <polyline points="210,398 250,398 250,195 284,195" fill="none" stroke="#9198a1" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="262" y="300" font-size="12" fill="#9198a1">same bearer API</text>

  <!-- Trust note, anchored under the boundary it describes -->
  <text x="514" y="352" font-size="12" fill="#9198a1">X-Forwarded-* is believed only from the proxy's pinned address —</text>
  <text x="514" y="370" font-size="12" fill="#9198a1">an empty trust list switches forwarded headers off entirely.</text>

  </g>
</svg>
