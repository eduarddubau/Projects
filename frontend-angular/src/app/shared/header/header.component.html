<mat-toolbar color="primary" class="app-header">
  <span routerLink="/" class="logo">Home</span>

  <span
    class="status-dot"
    [matTooltip]="health().state === 'offline' ? (health().error ?? 'API is offline') : 'API is Online'"
    matTooltipPosition="below"
    [class.online]="health().state === 'online'"
    [class.offline]="health().state === 'offline'">
  </span>

  @if (isAuthenticated()) {
    <a mat-button routerLink="/projects" routerLinkActive="active-link">
      Projects
    </a>
  }

  @if (isAdmin()) {
    <a mat-button routerLink="/admin" routerLinkActive="active-link">
      Admin
    </a>
  }

  <span class="spacer"></span>

  <div class="auth-actions">
    @if (!isAuthenticated()) {
      <a mat-button routerLink="/login">Login</a>
      <a mat-raised-button color="accent" routerLink="/register">Register</a>
    } @else {
      <button mat-button [matMenuTriggerFor]="profileMenu" class="profile-button">
        <div class="profile-content-wrapper">
          <mat-icon class="profile-icon">account_circle</mat-icon>
          <div class="user-text-stack">
            <span class="user-name">{{ currentUser()?.firstName }}</span>
            <span class="user-email">{{ currentUser()?.email }}</span>
          </div>
          <mat-icon class="arrow-icon">expand_more</mat-icon>
        </div>
      </button>
    }
  </div>
</mat-toolbar>

<mat-menu #profileMenu="matMenu" xPosition="before">
  <div class="menu-user-info" (click)="$event.stopPropagation()">
    <strong>{{ currentUser()?.firstName }} {{ currentUser()?.lastName }}</strong>
    <small>{{ currentUser()?.email }}</small>
  </div>
  <mat-divider></mat-divider>
  <button mat-menu-item routerLink="/projects">
    <mat-icon>folder</mat-icon>
    <span>My Projects</span>
  </button>
  @if (isAdmin()) {
    <mat-divider></mat-divider>
    <button mat-menu-item routerLink="/admin">
      <mat-icon>admin_panel_settings</mat-icon>
      <span>Admin Panel</span>
    </button>
  }
  <mat-divider></mat-divider>
  <button mat-menu-item (click)="logout()">
    <mat-icon>logout</mat-icon>
    <span>Sign Out</span>
  </button>
</mat-menu>
