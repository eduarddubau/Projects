@if (weather(); as w) {
  <div class="weather" *transloco="let t">
    <div class="weather-readout">
      <span class="weather-temp">{{ w.temperature }}°</span>
      <span class="weather-location">
        <mat-icon class="weather-loc-icon">location_on</mat-icon>{{ w.city }}
      </span>
    </div>
    <img class="weather-icon" [src]="'weather/' + w.icon + '.svg'" alt="" width="64" height="64" />
    <div class="weather-detail">
      <span class="weather-condition">{{ t('weather.conditions.' + w.conditionKey) }}</span>
      <span class="weather-stats">
        <span class="weather-stat">
          <mat-icon class="weather-stat-icon">water_drop</mat-icon>{{ w.humidity }}%
        </span>
        <span class="weather-stat">
          <mat-icon class="weather-stat-icon">air</mat-icon>{{ w.windSpeed }} km/h
        </span>
      </span>
    </div>
  </div>
}
