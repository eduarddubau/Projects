<ng-container *transloco="let t">
  <h2 mat-dialog-title>{{ data.title }}</h2>
  <mat-dialog-content>
    {{ data.message }}

    @if (data.confirmPhrase) {
      <mat-form-field appearance="outline" class="confirm-phrase" subscriptSizing="dynamic">
        <mat-label>{{ data.confirmPhraseLabel }}</mat-label>
        <input matInput [value]="typed()" (input)="onType($event)" autocomplete="off" />
        <!-- mat-hint, not loose text: Material wires it to the input's
             aria-describedby, so the phrase is announced with the field. -->
        <mat-hint>{{ t('common.confirmPhrase.hint', { phrase: data.confirmPhrase }) }}</mat-hint>
      </mat-form-field>
    }
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button (click)="cancel()">
      {{ data.cancelLabel ?? t('common.actions.cancel') }}
    </button>
    <button
      mat-flat-button
      [class.button-danger-filled]="data.warn"
      [disabled]="!canConfirm()"
      (click)="confirm()"
    >
      {{ data.confirmLabel ?? t('common.actions.confirm') }}
    </button>
  </mat-dialog-actions>
</ng-container>
