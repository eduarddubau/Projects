<mat-sidenav-container class="admin-container" *transloco="let t; prefix: 'admin.layout'">
  <mat-sidenav
    #drawer
    class="admin-sidenav"
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()"
  >
    <mat-nav-list>
      <a
        mat-list-item
        routerLink="/admin"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeIfHandset(drawer)"
      >
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>{{ t('dashboard') }}</span>
      </a>
      <a
        mat-list-item
        routerLink="/admin/users"
        routerLinkActive="active"
        (click)="closeIfHandset(drawer)"
      >
        <mat-icon matListItemIcon>people</mat-icon>
        <span matListItemTitle>{{ t('users') }}</span>
      </a>

      <mat-divider></mat-divider>
      <h3 matSubheader>{{ t('trash') }}</h3>

      <a
        mat-list-item
        routerLink="/admin/trash/projects"
        routerLinkActive="active"
        (click)="closeIfHandset(drawer)"
      >
        <mat-icon matListItemIcon>delete</mat-icon>
        <span matListItemTitle>{{ t('projects') }}</span>
      </a>
      <a
        mat-list-item
        routerLink="/admin/trash/users"
        routerLinkActive="active"
        (click)="closeIfHandset(drawer)"
      >
        <mat-icon matListItemIcon>person_off</mat-icon>
        <span matListItemTitle>{{ t('users') }}</span>
      </a>
      <a
        mat-list-item
        routerLink="/admin/trash/workspaces"
        routerLinkActive="active"
        (click)="closeIfHandset(drawer)"
      >
        <mat-icon matListItemIcon>folder_off</mat-icon>
        <span matListItemTitle>{{ t('workspaces') }}</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="admin-content">
    <app-aurora></app-aurora>
    @if (isHandset()) {
      <button mat-button class="drawer-toggle" (click)="drawer.toggle()">
        <mat-icon>menu</mat-icon>
        {{ t('menu') }}
      </button>
    }
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
