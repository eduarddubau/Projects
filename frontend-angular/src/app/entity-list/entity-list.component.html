<div class="mat-elevation-z2">

  <mat-form-field appearance="outline" style="width: 100%; margin-bottom: 20px;">
    <mat-label>Search Entities</mat-label>
    <input matInput [formControl]="searchControl" placeholder="Search by name...">
  </mat-form-field>

  <table mat-table [dataSource]="(data$ | async) || []" class="full-width-table" matSort aria-label="Elements">
    <!-- Id Column -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Id</th>
      <td mat-cell *matCellDef="let row">{{ row.id }}</td>
    </ng-container>

    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
      <td mat-cell *matCellDef="let row">{{ row.name }}</td>
    </ng-container>

    <!-- Created At Column -->
    <ng-container matColumnDef="createdAt">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Created At</th>
      <td mat-cell *matCellDef="let row">{{ row.createdAt | date:'yyyy-MM-dd HH:mm:ss' }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    
  </table>

  @if (dataSource.data.length > 0 && (data$ | async)?.length === 0) {
    <div class="no-results">
      No entities found matching your search.
    </div>
  } @else if (dataSource.data.length === 0) {
    <div class="empty-state">
      No records available.
    </div>
  }

  <mat-paginator
    #paginator
    [length]="dataSource.data.length"
    [pageIndex]="0"
    [pageSize]="10"
    [pageSizeOptions]="[5, 10, 20]"
    aria-label="Select page"
  >
  </mat-paginator>
</div>
