<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Projects — organize your work</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Projects gives your team a clean, fast home for everything you're building."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f6f8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#18181c" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Applies the stored theme before first paint so a dark-mode reload never flashes light. -->
    <script>
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset['theme'] = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
